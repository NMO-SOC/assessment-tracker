<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English 7–10 Assessment Coverage Tracker</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#16202c; --muted:#6b7785; --line:#e2e6eb;
    --accent:#1f6feb; --accent-soft:#e8f0fe; --ok:#137a4c; --ok-soft:#e3f4ea;
    --warn:#8a5a00; --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       background:var(--bg);color:var(--ink)}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:16px 20px;position:sticky;top:0;z-index:20}
  h1{margin:0 0 2px;font-size:19px}
  .sub{color:var(--muted);font-size:13px}
  .wrap{max-width:1100px;margin:0 auto}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;background:var(--card);padding:7px 13px;cursor:pointer;font:inherit;font-size:14px;
              border-right:1px solid var(--line)}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--accent);color:#fff}
  select,input[type=text],input[type=date],input[type=search],textarea{
    font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
  input[type=search]{min-width:220px;flex:1}
  .btn{font:inherit;padding:7px 13px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer}
  .btn:hover{background:#f0f2f5}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.danger{color:#b3261e}
  main{max-width:1100px;margin:18px auto 60px;padding:0 20px}
  .stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;min-width:130px;flex:1}
  .stat b{display:block;font-size:20px}
  .stat span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:7px}
  .bar i{display:block;height:100%;background:var(--ok)}
  h2.strand{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:26px 0 8px}
  h3.substrand{font-size:14px;margin:16px 0 6px;color:var(--ink)}
  .cd{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;overflow:hidden}
  .cd.covered{border-left:4px solid var(--ok)}
  .cd.uncovered{border-left:4px solid var(--line)}
  .cd-head{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;cursor:pointer}
  .cd-head:hover{background:#fafbfc}
  .code{font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--accent-soft);color:#0b4bb3;
        padding:1px 7px;border-radius:5px;white-space:nowrap}
  .lvl{font-size:11px;color:var(--muted);white-space:nowrap;padding-top:3px}
  .desc{flex:1}
  .pill{font-size:12px;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--line);color:var(--muted)}
  .pill.on{background:var(--ok-soft);color:var(--ok)}
  .cd-body{border-top:1px solid var(--line);padding:12px 14px;background:#fbfcfd;display:none}
  .cd.open .cd-body{display:block}
  table.rec{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:10px}
  table.rec th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
               padding:4px 8px 4px 0;font-weight:600}
  table.rec td{padding:5px 8px 5px 0;border-top:1px solid var(--line);vertical-align:top}
  .form{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
  .form input[type=text]{min-width:180px}
  .form textarea{min-width:220px;flex:1;min-height:36px;resize:vertical}
  .empty{color:var(--muted);font-size:13px;margin:0 0 10px}
  .note{background:#fff8e6;border:1px solid #f0dfae;color:var(--warn);padding:9px 12px;border-radius:8px;
        font-size:13px;margin-bottom:14px;display:none}
  .assessment-list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .assessment-list h4{margin:0 0 4px;font-size:15px}
  .assessment-list li{margin-bottom:14px;list-style:none}
  .assessment-list ul{padding:0;margin:0}
  .codes{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:0 20px 40px;max-width:1100px;margin:0 auto}
  @media (max-width:620px){.cd-head{flex-wrap:wrap}.lvl{order:-1}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>English 7–10 — Assessment Coverage Tracker</h1>
    <div class="sub">Victorian Curriculum F–10 Version 2.0 · tick off each content description as you assess it</div>
    <div class="toolbar">
      <div class="seg" id="levelSeg"></div>
      <select id="strandSel"><option value="">All strands</option></select>
      <select id="statusSel">
        <option value="">All</option>
        <option value="covered">Assessed only</option>
        <option value="uncovered">Not yet assessed</option>
      </select>
      <select id="classSel"><option value="">All classes</option></select>
      <input type="search" id="q" placeholder="Search description, code, assessment…">
      <div class="seg" id="viewSeg">
        <button data-view="curriculum" class="on">Curriculum</button>
        <button data-view="assessments">By assessment</button>
      </div>
    </div>
    <div class="toolbar">
      <button class="btn primary" id="exportBtn">Export coverage.json</button>
      <button class="btn" id="importBtn">Import JSON</button>
      <button class="btn" id="csvBtn">Export CSV</button>
      <button class="btn" id="repoBtn">Reload from repo file</button>
      <button class="btn danger" id="clearBtn">Clear all</button>
      <input type="file" id="fileIn" accept=".json" hidden>
    </div>
  </div>
</header>

<main>
  <div class="note" id="note"></div>
  <div class="stats" id="stats"></div>
  <div id="content"></div>
</main>
<footer id="foot"></footer>

<script src="data/curriculum.js"></script>
<script>
(function(){
  "use strict";
  const LS_KEY = "vic-english-7-10-coverage-v1";
  const DATA = window.CURRICULUM;
  const ITEMS = DATA.items;
  const LEVELS = DATA.levels;

  // coverage: { CODE: [ {id, assessment, date, cls, notes} ] }
  let coverage = {};
  let baseline = null;
  const ui = { level:"", strand:"", status:"", cls:"", q:"", view:"curriculum", open:{} };

  /* ---------- storage ---------- */
  function load(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      if (raw){ coverage = JSON.parse(raw).coverage || {}; return true; }
    }catch(e){}
    return false;
  }
  function save(){
    try{
      localStorage.setItem(LS_KEY, JSON.stringify({version:1, updated:new Date().toISOString(), coverage:coverage}));
    }catch(e){ showNote("Could not save to this browser's storage: "+e.message); }
  }
  function fetchBaseline(){
    return fetch("data/coverage.json", {cache:"no-store"})
      .then(r => r.ok ? r.json() : null)
      .catch(() => null);
  }
  function showNote(msg){
    const n = document.getElementById("note");
    n.textContent = msg; n.style.display = msg ? "block" : "none";
  }

  /* ---------- helpers ---------- */
  const uid = () => Math.random().toString(36).slice(2,10);
  const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const recs = code => coverage[code] || [];
  function allClasses(){
    const s = new Set();
    Object.values(coverage).forEach(a => a.forEach(r => { if (r.cls) s.add(r.cls); }));
    return [...s].sort();
  }
  function matches(it){
    if (ui.level && it.level !== ui.level) return false;
    if (ui.strand && it.strand !== ui.strand) return false;
    const rs = recs(it.code);
    const inClass = ui.cls ? rs.filter(r => r.cls === ui.cls) : rs;
    if (ui.status === "covered" && !inClass.length) return false;
    if (ui.status === "uncovered" && inClass.length) return false;
    if (ui.q){
      const hay = (it.code+" "+it.description+" "+it.strand+" "+it.substrand+" "+
        rs.map(r => [r.assessment,r.cls,r.notes].join(" ")).join(" ")).toLowerCase();
      if (!hay.includes(ui.q.toLowerCase())) return false;
    }
    return true;
  }
  function coveredCount(list){
    return list.filter(it => (ui.cls ? recs(it.code).some(r => r.cls === ui.cls) : recs(it.code).length)).length;
  }

  /* ---------- render ---------- */
  function renderStats(){
    const scope = ITEMS.filter(it => (!ui.level || it.level===ui.level) && (!ui.strand || it.strand===ui.strand));
    const cards = [];
    const tot = scope.length, cov = coveredCount(scope);
    cards.push(statCard(ui.level ? "Level "+ui.level : "All levels", cov, tot));
    const groupBy = ui.level ? "strand" : "level";
    const keys = groupBy === "strand" ? ["Language","Literature","Literacy"] : LEVELS;
    keys.forEach(k => {
      const list = scope.filter(it => (groupBy==="strand" ? it.strand : it.level) === k);
      if (!list.length) return;
      cards.push(statCard(groupBy==="strand" ? k : "Level "+k, coveredCount(list), list.length));
    });
    const nRec = Object.values(coverage).reduce((n,a)=>n+a.length,0);
    const nAss = new Set(); Object.values(coverage).forEach(a=>a.forEach(r=>nAss.add(r.assessment)));
    cards.push('<div class="stat"><span>Records</span><b>'+nRec+'</b><span>'+nAss.size+' assessment'+(nAss.size===1?"":"s")+'</span></div>');
    document.getElementById("stats").innerHTML = cards.join("");
  }
  function statCard(label, cov, tot){
    const pct = tot ? Math.round(cov/tot*100) : 0;
    return '<div class="stat"><span>'+esc(label)+'</span><b>'+cov+"/"+tot+'</b>'+
           '<div class="bar"><i style="width:'+pct+'%"></i></div></div>';
  }

  function renderCurriculum(){
    const list = ITEMS.filter(matches);
    if (!list.length) return '<p class="empty">No content descriptions match these filters.</p>';
    let html = "", lastStrand = null, lastSub = null;
    ["Language","Literature","Literacy"].forEach(strand => {
      const inStrand = list.filter(it => it.strand === strand);
      if (!inStrand.length) return;
      html += '<h2 class="strand">'+strand+' <span class="pill">'+coveredCount(inStrand)+"/"+inStrand.length+' assessed</span></h2>';
      const subs = [...new Set(inStrand.map(it => it.substrand))];
      subs.forEach(sub => {
        html += '<h3 class="substrand">'+esc(sub)+'</h3>';
        inStrand.filter(it => it.substrand === sub)
          .sort((a,b) => (LEVELS.indexOf(a.level)-LEVELS.indexOf(b.level)) || a.code.localeCompare(b.code))
          .forEach(it => { html += cdCard(it); });
      });
    });
    return html;
  }

  function cdCard(it){
    const rs = recs(it.code);
    const shown = ui.cls ? rs.filter(r => r.cls === ui.cls) : rs;
    const open = !!ui.open[it.code];
    let h = '<div class="cd '+(shown.length?"covered":"uncovered")+(open?" open":"")+'" data-code="'+it.code+'">';
    h += '<div class="cd-head" data-toggle="'+it.code+'">';
    h += '<span class="code">'+it.code+'</span>';
    h += '<span class="lvl">Lv '+it.level+'</span>';
    h += '<span class="desc">'+esc(it.description)+'</span>';
    h += '<span class="pill '+(shown.length?"on":"")+'">'+(shown.length ? shown.length+"×" : "not assessed")+'</span>';
    h += '</div><div class="cd-body">';
    if (rs.length){
      h += '<table class="rec"><thead><tr><th>Assessment</th><th>Date</th><th>Class</th><th>Notes</th><th></th></tr></thead><tbody>';
      rs.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")).forEach(r => {
        h += '<tr><td><b>'+esc(r.assessment)+'</b></td><td>'+esc(r.date||"—")+'</td><td>'+esc(r.cls||"—")+
             '</td><td>'+esc(r.notes||"")+'</td>'+
             '<td><button class="btn danger" data-del="'+r.id+'" data-code="'+it.code+'">Remove</button></td></tr>';
      });
      h += '</tbody></table>';
    } else {
      h += '<p class="empty">Not yet assessed. Add the assessment that covered this.</p>';
    }
    h += '<form class="form" data-add="'+it.code+'">'+
         '<input type="text" name="assessment" placeholder="Assessment name *" required>'+
         '<input type="date" name="date" value="'+new Date().toISOString().slice(0,10)+'">'+
         '<input type="text" name="cls" placeholder="Class / cohort" list="classList">'+
         '<textarea name="notes" placeholder="Notes / evidence"></textarea>'+
         '<button class="btn primary" type="submit">Mark assessed</button></form>';
    h += '</div></div>';
    return h;
  }

  function renderAssessments(){
    const by = {};
    ITEMS.forEach(it => {
      recs(it.code).forEach(r => {
        if (ui.level && it.level !== ui.level) return;
        if (ui.strand && it.strand !== ui.strand) return;
        if (ui.cls && r.cls !== ui.cls) return;
        if (ui.q){
          const hay = (r.assessment+" "+(r.cls||"")+" "+(r.notes||"")+" "+it.code+" "+it.description).toLowerCase();
          if (!hay.includes(ui.q.toLowerCase())) return;
        }
        const key = r.assessment+"||"+(r.cls||"")+"||"+(r.date||"");
        (by[key] = by[key] || {assessment:r.assessment, cls:r.cls, date:r.date, notes:[], items:[]});
        by[key].items.push(it);
        if (r.notes) by[key].notes.push(it.code+": "+r.notes);
      });
    });
    const groups = Object.values(by).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if (!groups.length) return '<p class="empty">No assessment records yet.</p>';
    let h = '<div class="assessment-list"><ul>';
    groups.forEach(g => {
      h += '<li><h4>'+esc(g.assessment)+'</h4><div class="sub" style="color:var(--muted);font-size:13px">'+
           [g.date||"no date", g.cls||"no class", g.items.length+" content description"+(g.items.length===1?"":"s")].map(esc).join(" · ")+
           '</div><div class="codes">'+
           g.items.sort((a,b)=>a.code.localeCompare(b.code))
             .map(it => '<span class="code" title="'+esc(it.description)+'">'+it.code+'</span>').join("")+
           '</div>'+(g.notes.length?'<div class="empty" style="margin-top:6px">'+esc(g.notes.join(" | "))+'</div>':'')+'</li>';
    });
    return h + '</ul></div>';
  }

  function render(){
    renderStats();
    document.getElementById("content").innerHTML =
      ui.view === "assessments" ? renderAssessments() : renderCurriculum();
    // class datalist + filter
    const cls = allClasses();
    let dl = document.getElementById("classList");
    if (!dl){ dl = document.createElement("datalist"); dl.id = "classList"; document.body.appendChild(dl); }
    dl.innerHTML = cls.map(c => '<option value="'+esc(c)+'">').join("");
    const sel = document.getElementById("classSel");
    const cur = sel.value;
    sel.innerHTML = '<option value="">All classes</option>' + cls.map(c=>'<option'+(c===cur?" selected":"")+'>'+esc(c)+'</option>').join("");
    const covTot = coveredCount(ITEMS);
    document.getElementById("foot").textContent =
      covTot+" of "+ITEMS.length+" content descriptions assessed · "+DATA.source;
  }

  /* ---------- events ---------- */
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-toggle]");
    if (t){ const c = t.getAttribute("data-toggle"); ui.open[c] = !ui.open[c];
            t.parentElement.classList.toggle("open", ui.open[c]); return; }
    const d = e.target.closest("[data-del]");
    if (d){
      const code = d.getAttribute("data-code"), id = d.getAttribute("data-del");
      coverage[code] = recs(code).filter(r => r.id !== id);
      if (!coverage[code].length) delete coverage[code];
      save(); render(); return;
    }
  });
  document.addEventListener("submit", e => {
    const f = e.target.closest("[data-add]");
    if (!f) return;
    e.preventDefault();
    const code = f.getAttribute("data-add");
    const fd = new FormData(f);
    const name = (fd.get("assessment")||"").toString().trim();
    if (!name) return;
    (coverage[code] = coverage[code] || []).push({
      id: uid(), assessment: name,
      date: (fd.get("date")||"").toString(),
      cls: (fd.get("cls")||"").toString().trim(),
      notes: (fd.get("notes")||"").toString().trim()
    });
    ui.open[code] = true;
    save(); render();
  });

  function bindSeg(id, key){
    document.getElementById(id).addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      [...b.parentElement.children].forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      ui[key] = b.dataset[key] !== undefined ? b.dataset[key] : b.dataset.val;
      render();
    });
  }

  function init(){
    // level segmented control
    document.getElementById("levelSeg").innerHTML =
      '<button data-val="" class="on">All levels</button>' + LEVELS.map(l=>'<button data-val="'+l+'">Level '+l+'</button>').join("");
    bindSeg("levelSeg","level");
    bindSeg("viewSeg","view");
    document.getElementById("strandSel").innerHTML =
      '<option value="">All strands</option>' + ["Language","Literature","Literacy"].map(s=>'<option>'+s+'</option>').join("");
    document.getElementById("strandSel").onchange = e => { ui.strand = e.target.value; render(); };
    document.getElementById("statusSel").onchange = e => { ui.status = e.target.value; render(); };
    document.getElementById("classSel").onchange = e => { ui.cls = e.target.value; render(); };
    let tm; document.getElementById("q").oninput = e => {
      clearTimeout(tm); tm = setTimeout(() => { ui.q = e.target.value.trim(); render(); }, 180);
    };

    document.getElementById("exportBtn").onclick = () => {
      download("coverage.json", JSON.stringify({version:1, updated:new Date().toISOString(), coverage:coverage}, null, 1), "application/json");
    };
    document.getElementById("csvBtn").onclick = () => {
      const rows = [["code","level","strand","substrand","description","assessment","date","class","notes"]];
      ITEMS.forEach(it => {
        const rs = recs(it.code);
        if (!rs.length) rows.push([it.code,it.level,it.strand,it.substrand,it.description,"","","",""]);
        else rs.forEach(r => rows.push([it.code,it.level,it.strand,it.substrand,it.description,r.assessment,r.date,r.cls,r.notes]));
      });
      const csv = rows.map(r => r.map(c => '"'+String(c==null?"":c).replace(/"/g,'""')+'"').join(",")).join("\r\n");
      download("english-7-10-coverage.csv", csv, "text/csv");
    };
    document.getElementById("importBtn").onclick = () => document.getElementById("fileIn").click();
    document.getElementById("fileIn").onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      const fr = new FileReader();
      fr.onload = () => {
        try{
          const j = JSON.parse(fr.result);
          const c = j.coverage || j;
          if (typeof c !== "object") throw new Error("unexpected format");
          coverage = c; save(); render(); showNote("Imported "+f.name+".");
        }catch(err){ showNote("Could not import that file: "+err.message); }
      };
      fr.readAsText(f);
      e.target.value = "";
    };
    document.getElementById("repoBtn").onclick = () => {
      fetchBaseline().then(b => {
        if (!b){ showNote("Couldn't read data/coverage.json (this needs to be served over http — GitHub Pages or a local server)."); return; }
        if (!confirm("Replace what's in this browser with the committed data/coverage.json?")) return;
        coverage = b.coverage || {}; save(); render(); showNote("Loaded committed data/coverage.json.");
      });
    };
    document.getElementById("clearBtn").onclick = () => {
      if (!confirm("Delete all assessment records stored in this browser? Export first if you want a backup.")) return;
      coverage = {}; save(); render();
    };

    const hadLocal = load();
    render();
    fetchBaseline().then(b => {
      baseline = b;
      if (b && !hadLocal && b.coverage && Object.keys(b.coverage).length){
        coverage = b.coverage; save(); render();
        showNote("Loaded committed coverage from data/coverage.json.");
      }
    });
  }

  function download(name, text, type){
    const blob = new Blob([text], {type:type+";charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  }

  init();
})();
</script>
</body>
</html>
